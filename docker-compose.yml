version: '3.8'

services:
  weather-adapter:
    build:
      context: .
      dockerfile: Dockerfile
    image: weather-adapter:latest
    container_name: weather-adapter
    ports:
      - "8081:8081"
    environment:
      # Weather API configuration
      - WEATHER_API_KEY=${WEATHER_API_KEY}
    env_file:
      - .env
    networks:
      - weather-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 3s
      start_period: 60s
      retries: 3
    labels:
      - "com.weather-adapter.description=Spring Boot Weather API Adapter"
      - "com.weather-adapter.version=0.0.1-SNAPSHOT"

networks:
  weather-network:
    driver: bridge
    name: weather-network
